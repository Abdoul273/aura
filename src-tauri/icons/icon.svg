<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff6fb5"/>
      <stop offset="0.38" stop-color="#9b5cff"/>
      <stop offset="0.75" stop-color="#4b3fd1"/>
      <stop offset="1" stop-color="#1c1648"/>
    </linearGradient>
    <radialGradient id="aura1" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="0.2" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#38d6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6dcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#12072e" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a0d5e" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="80" y="80" width="864" height="864" rx="210"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="80" y="80" width="864" height="864" rx="210" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="80" y="80" width="864" height="864" fill="url(#aura1)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#aura2)"/>
    <ellipse cx="512" cy="150" rx="520" ry="300" fill="url(#gloss)"/>
  </g>
  <rect x="82" y="82" width="860" height="860" rx="208" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- disque de verre -->
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="292" fill="url(#glass)"/>
  </g>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <path d="M 262 430 A 262 262 0 0 1 700 300" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>

  <!-- onde sonore -->
  <g fill="url(#bar)" filter="url(#soft)">
    <rect x="336" y="452" width="44" height="120" rx="22"/>
    <rect x="404" y="392" width="44" height="240" rx="22"/>
    <rect x="472" y="322" width="44" height="380" rx="22"/>
    <rect x="540" y="372" width="44" height="280" rx="22"/>
    <rect x="608" y="422" width="44" height="180" rx="22"/>
    <rect x="676" y="472" width="44" height="80" rx="22" opacity="0.85"/>
  </g>
</svg>
